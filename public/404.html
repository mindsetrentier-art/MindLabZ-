<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindLabZ · Redirection...</title>
    <script>
      // Single Page Application 404 Recovery Handler
      // Captures the full path that produced a 404 and seamlessly routes back to the SPA
      (function () {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        
        // Exclude static assets like .png, .js, .css
        if (!/\.(png|jpg|jpeg|svg|ico|js|css|json|webmanifest)$/i.test(path)) {
          var target = '/' + (path.charAt(0) === '/' ? path.slice(1) : path) + search + hash;
          sessionStorage.setItem('mindlabz_redirect_path', target);
          window.location.replace('/?redirect=' + encodeURIComponent(target));
        }
      })();
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #FAF8F5;
        color: #1C1917;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
      }
      .card {
        max-width: 420px;
        padding: 32px;
        background: #ffffff;
        border-radius: 20px;
        border: 1px solid #E7E5E4;
        box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #E7E5E4;
        border-top-color: #D97706;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      a.btn {
        display: inline-block;
        margin-top: 16px;
        padding: 10px 20px;
        background: #1C1917;
        color: #ffffff;
        text-decoration: none;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="spinner"></div>
      <h2 style="margin: 0 0 8px; font-size: 18px; font-weight: 700;">Chargement de MindLabZ...</h2>
      <p style="margin: 0; font-size: 13px; color: #78716C;">
        Redirection fluide vers votre session. Si la page ne se charge pas automatiquement :
      </p>
      <a href="/" class="btn">Accéder à l'accueil</a>
    </div>
  </body>
</html>
